<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Bias-bounded benchmark subset selection</title>
  <desc id="desc">A compact subset selected from a full benchmark preserves score estimates and model rankings.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#edf4ff"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#4361a9"/>
    </marker>
  </defs>
  <rect width="1000" height="560" rx="28" fill="#ffffff"/>
  <rect x="35" y="58" width="270" height="430" rx="24" fill="url(#panel)" stroke="#b8cae8" stroke-width="2"/>
  <text x="170" y="104" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17345e">Full benchmark</text>
  <text x="170" y="134" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#59708f">100% evaluation cost</text>
  <g fill="#c7d5e9" stroke="#8ea7c8">
    <circle cx="78" cy="180" r="16"/><circle cx="124" cy="180" r="16"/><circle cx="170" cy="180" r="16"/><circle cx="216" cy="180" r="16"/><circle cx="262" cy="180" r="16"/>
    <circle cx="78" cy="226" r="16"/><circle cx="124" cy="226" r="16"/><circle cx="170" cy="226" r="16"/><circle cx="216" cy="226" r="16"/><circle cx="262" cy="226" r="16"/>
    <circle cx="78" cy="272" r="16"/><circle cx="124" cy="272" r="16"/><circle cx="170" cy="272" r="16"/><circle cx="216" cy="272" r="16"/><circle cx="262" cy="272" r="16"/>
    <circle cx="78" cy="318" r="16"/><circle cx="124" cy="318" r="16"/><circle cx="170" cy="318" r="16"/><circle cx="216" cy="318" r="16"/><circle cx="262" cy="318" r="16"/>
    <circle cx="78" cy="364" r="16"/><circle cx="124" cy="364" r="16"/><circle cx="170" cy="364" r="16"/><circle cx="216" cy="364" r="16"/><circle cx="262" cy="364" r="16"/>
    <circle cx="78" cy="410" r="16"/><circle cx="124" cy="410" r="16"/><circle cx="170" cy="410" r="16"/><circle cx="216" cy="410" r="16"/><circle cx="262" cy="410" r="16"/>
  </g>
  <g fill="#f2a541" stroke="#d47e10" stroke-width="2">
    <circle cx="78" cy="180" r="16"/><circle cx="216" cy="180" r="16"/><circle cx="124" cy="226" r="16"/><circle cx="262" cy="226" r="16"/>
    <circle cx="170" cy="272" r="16"/><circle cx="78" cy="318" r="16"/><circle cx="216" cy="318" r="16"/><circle cx="124" cy="364" r="16"/><circle cx="262" cy="410" r="16"/>
  </g>
  <path d="M325 274 H425" stroke="#4361a9" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="375" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#4361a9">Bias-bounded</text>
  <text x="375" y="249" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#4361a9">greedy selection</text>
  <rect x="448" y="132" width="190" height="284" rx="24" fill="#fff8ed" stroke="#edbc72" stroke-width="2"/>
  <text x="543" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#74460b">Compact subset</text>
  <text x="543" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#926222">≤ 30% of items</text>
  <g fill="#f2a541" stroke="#d47e10" stroke-width="2">
    <circle cx="493" cy="258" r="19"/><circle cx="543" cy="258" r="19"/><circle cx="593" cy="258" r="19"/>
    <circle cx="493" cy="310" r="19"/><circle cx="543" cy="310" r="19"/><circle cx="593" cy="310" r="19"/>
    <circle cx="493" cy="362" r="19"/><circle cx="543" cy="362" r="19"/><circle cx="593" cy="362" r="19"/>
  </g>
  <path d="M660 274 H747" stroke="#4361a9" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="704" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#4361a9">Estimate</text>
  <text x="704" y="261" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#4361a9">scores</text>
  <rect x="765" y="98" width="205" height="360" rx="24" fill="url(#panel)" stroke="#b8cae8" stroke-width="2"/>
  <text x="867" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#17345e">Reliable ranking</text>
  <line x1="810" y1="388" x2="935" y2="388" stroke="#8ea7c8" stroke-width="3"/>
  <line x1="810" y1="388" x2="810" y2="205" stroke="#8ea7c8" stroke-width="3"/>
  <path d="M814 370 C842 345, 845 322, 870 306 S909 255, 932 218" fill="none" stroke="#315ca8" stroke-width="8" stroke-linecap="round"/>
  <circle cx="834" cy="350" r="8" fill="#f2a541"/><circle cx="870" cy="306" r="8" fill="#f2a541"/><circle cx="901" cy="270" r="8" fill="#f2a541"/><circle cx="932" cy="218" r="8" fill="#f2a541"/>
  <text x="867" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#59708f">Score and order preserved</text>
  <text x="500" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#59708f">Efficient evaluation with theoretical bias control and generalization guarantees</text>
</svg>
